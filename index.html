<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترجيعة – منصة الشحن بالحمولة المشتركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f6;--card:#fff;--ink:#1b2430;--mute:#66707c;--line:#dde1e5;--road:#1b2430;--sign:#f2b705;--ok:#1f8a70;--warn:#c2410c;--cell:#e6e9ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}
header{background:var(--road);color:#fff;padding:16px 14px 0;margin:0 -14px 14px}
header h1{margin:0;font-size:26px;font-weight:800}
header h1 span{color:var(--sign)}
header p{margin:0 0 12px;color:#e8eef4;font-size:13px}
.roles{display:flex;gap:6px}
.roles button{flex:1;border:0;padding:10px;font:inherit;font-weight:600;background:#2a3544;color:#cfd6de;border-radius:10px 10px 0 0;cursor:pointer}
.roles button.on{background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#1b2430;padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tabs button.on{background:#f2b705!important;border-color:#f2b705!important;color:#1b2430;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 10px 28px rgba(15,34,51,.12)}
.card h3{margin:0 0 4px;font-size:16px;color:#1b2430}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:#3d4a59;font-size:13px}
label{display:block;font-size:14px;font-weight:700;color:#1b2430;margin:10px 0 3px}
select,input{width:100%;padding:10px;border:1.5px solid #cbd2da;border-radius:8px;font:inherit;background:#fff;color:#1b2430;font-weight:600}
input::placeholder{color:#7a8794}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--road);color:#fff;padding:10px 16px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sign{background:linear-gradient(135deg,#f2b705,#ffcf3d)!important;color:#1b2430!important;font-weight:800;box-shadow:0 6px 16px rgba(242,183,5,.35)}
.btn.full{width:100%;margin-top:14px}
.btn:disabled{opacity:.45}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:#e6e9ec;font-weight:600}
.tag.ok{background:var(--ok);color:#fff}.tag.ret{background:var(--sign);color:#1b2430}
.truck{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:10px 0 4px;padding:4px;border:2px solid var(--road);border-radius:6px 6px 6px 22px}
.truck i{height:14px;background:#e6e9ec;border-radius:2px}
.truck i.f{background:var(--ok)}
.price{font-weight:800;font-size:18px}
.save{color:var(--ok);font-weight:600;font-size:13px}
.pin{font-size:24px;font-weight:800;letter-spacing:6px;text-align:center;background:var(--bg);border:2px dashed var(--sign);border-radius:10px;padding:6px;margin:8px 0}
.bid{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.empty{text-align:center;color:#3d4a59;padding:26px 10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--road);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.note{background:#e6e9ec;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.paybox{background:#fff7d6;border:2px solid #f2b705;border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.paybox b{font-size:18px;letter-spacing:1px}
.blocked{background:#fff1f1;border:2px solid #c2410c;border-radius:20px;padding:16px;margin-bottom:12px;text-align:center}
.blocked h3{color:#c2410c!important;margin:0 0 6px}
.blocked p{color:#1b2430;font-size:14px;margin:4px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{background:linear-gradient(180deg,#0f2233 0%,#12314d 28%,#f4f5f6 28%)!important;background-attachment:fixed}
header{background:linear-gradient(135deg,#0f2233 0%,#1b3a56 55%,#2a5a82 100%)!important;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding-bottom:18px!important}
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 20%,#2a5a82 0%,#0f2233 55%,#071521 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s, visibility .7s}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:140px;height:140px;background:linear-gradient(135deg,#fff,#ffe9a8);border-radius:38px;display:flex;align-items:center;justify-content:center;font-size:78px;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 8px rgba(242,183,5,.25);animation:bounceIn 1s ease, floatY 2s ease-in-out 1s infinite}
@keyframes bounceIn{0%{transform:scale(.3) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.splash-title{color:#fff;font-size:44px;font-weight:800}
.splash-title span{color:#f2b705}
.splash-sub{color:#cfe0ee;font-size:16px;text-align:center;padding:0 30px}
.splash-road{width:260px;height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.splash-road i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#f2b705,#ffcf3d);border-radius:99px;animation:drive 1.1s ease-in-out infinite}
@keyframes drive{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.splash-dots{color:#f2b705;font-size:22px;letter-spacing:6px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body><div id="splash"><div class="splash-logo">🚛</div><div class="splash-title">ترجيعة<span>.</span></div><div class="splash-sub">كل عربية راجعة فاضية<br>هي شحنة رخيصة لعميل</div><div class="splash-road"><i></i></div><div class="splash-dots">● ● ●</div><div style="color:#fff;font-size:13px">جاري التحميل... اضغط للتخطي</div></div><script>const _sp=document.getElementById('splash');_sp.addEventListener('click',()=>_sp.classList.add('hide'));setTimeout(()=>{_sp && _sp.classList.add('hide')},4000)</script>
<div class="wrap">
<header><h1 style="display:flex;align-items:center;gap:10px"><span style="background:linear-gradient(135deg,#f2b705,#ffcf3d);width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 20px rgba(0,0,0,.3)">🚛</span> ترجيعة<span>.</span></h1><p>كل عربية راجعة فاضية هي شحنة رخيصة لعميل</p><div class="roles" id="roles"></div></header>
<div class="tabs" id="tabs"></div>
<main id="app"><div class="empty">جاري التحميل…</div></main>
</div>
<div id="toast" role="status"></div>
<script>
const SB_URL="https://empsphgkxtxjjvevxtay.supabase.co",SB_KEY="sb_publishable_uu5rRwik-GGOj1YYn0VhHQ_BR9TJK-c";
const sb=supabase.createClient(SB_URL,SB_KEY);
const COMMISSION=0.10;
const PAY_NUMBER="01210932190";
const PAY_METHOD="أورانج كاش / انستا باي";
const C={"القاهرة":[30.04,31.24],"الإسكندرية":[31.2,29.92],"الغردقة":[27.26,33.81],"السويس":[29.97,32.55],"بورسعيد":[31.26,32.3],"المنصورة":[31.04,31.38],"أسيوط":[27.18,31.18],"الأقصر":[25.69,32.64],"أسوان":[24.09,32.9],"شرم الشيخ":[27.91,34.33]};
const CITIES=Object.keys(C),DATES=["اليوم","غدًا","بعد يومين","خلال أسبوع"],SL={open:"مفتوحة للعروض",booked:"تم الحجز",loading:"جاري التحميل",transit:"في الطريق",delivered:"تم التسليم"};
const km=(a,b)=>{const r=x=>x*Math.PI/180,[p,q]=C[a],[u,v]=C[b],h=Math.sin(r(u-p)/2)**2+Math.cos(r(p))*Math.cos(r(u))*Math.sin(r(v-q)/2)**2;return Math.round(12742*Math.asin(Math.sqrt(h))*1.25)};
const base=(a,b)=>Math.max(60,Math.round(km(a,b)*.9/10)*10),cur=t=>Math.round(t.base_ppm*(1-.25*t.used_m3/t.capacity_m3)),money=n=>Math.round(n).toLocaleString("ar-EG")+" ج.م";
const commOf=total=>Math.round(total*COMMISSION),netOf=total=>Math.round(total*(1-COMMISSION));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=(a,b)=>`${esc(a)} ← ${esc(b)}`,$=i=>document.getElementById(i).value;
const opts=(a,sel)=>a.map(x=>`<option${x===sel?" selected":""}>${x}</option>`).join("");
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.className="show";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",3200)};
let uid=null,me=null,tab=null,mode="in",data={trips:[],ships:[],names:{},pend:[]},busy=false;
function isBlocked(){ if(!me) return false; if(me.is_blocked) return true; try{ if(localStorage.getItem('blocked-'+uid)==='1') return true; }catch(e){} return false; }
function unpaidAmount(){ try{ return +(localStorage.getItem('unpaid-'+uid)||0); }catch(e){ return 0; } }
function blockedView(){
 const amt=unpaidAmount();
 return `<div class="blocked"><h3>⛔ تم إيقاف حسابك مؤقتاً</h3><p><b>السبب: لم ترسل العمولة</b></p>${amt>0?`<p>عليك عمولة: <b>${money(amt)}</b></p>`:`<p>عليك عمولة مستحقة لم يتم إرسالها</p>`}<p>ابعت العمولة على <b>${PAY_NUMBER}</b> - ${PAY_METHOD}</p><p>وبعدها ابعت سكرين شوت على الواتساب على نفس الرقم عشان نفك الإيقاف</p><button class="btn sign full" onclick="requestUnblock()">بعت العمولة - اطلب فك الإيقاف</button><p class="mute" style="margin-top:8px">الخدمات المتوقفة: نشر رحلة جديدة - تقديم عروض - مشاهدة طلبات العملاء</p></div>`;
}
function requestUnblock(){ toast("تم إرسال طلب فك الإيقاف. هنراجع التحويل ونفك حسابك."); }
const ok=async(p,msg)=>{const r=await p;if(r.error){toast(r.error.message);return false}if(msg)toast(msg);return true};
sb.auth.onAuthStateChange((_e,ses)=>{uid=ses?.user?.id||null;setTimeout(boot,0)});
async function boot(){if(!uid){me=null;return render()}
 const pres=await sb.from("profiles").select("*").eq("id",uid).maybeSingle();me=pres.data;if(me)await load();render()}
async function load(){
 const tres=await sb.from("trips").select("*").order("created_at",{ascending:false});
 const sres=await sb.from("shipments").select("*, bids(*)").order("created_at",{ascending:false});
 const nres=await sb.rpc("public_carriers");
 data.trips=tres.data||[];data.ships=sres.data||[];data.names={};(nres.data||[]).forEach(c=>data.names[c.id]=c);
 if(me && me.role=="admin"){const pres2=await sb.from("profiles").select("*").eq("role","carrier").eq("verified",false);data.pend=pres2.data||[]}}
const cn=id=>data.names[id]?.name||"ناقل";
async function auth(kind){
 const email=$("em").trim(),pw=$("pw");
 if(!email||pw.length<6)return toast("اكتب الإيميل وباسورد 6 أحرف على الأقل");
 if(kind=="up"){
   let upRes=await sb.auth.signUp({email:email,password:pw});
   if(upRes.error) return toast(upRes.error.message);
   if(!upRes.data.session) toast("تم إنشاء الحساب. افتح الإيميل لتأكيده ثم سجّل الدخول");
 } else {
   let inRes=await sb.auth.signInWithPassword({email:email,password:pw});
   if(inRes.error) toast(inRes.error.message==="Invalid login credentials"?"الإيميل أو الباسورد غير صحيح":inRes.error.message);
 }
}
const logout=()=>sb.auth.signOut();
async function mkProfile(role){const name=$("n").trim(),phone=$("ph").trim();if(!name||phone.length<8)return toast("اكتب الاسم ورقم هاتف صحيح");
 const row={id:uid,role,name,phone};if(role=="carrier"){row.plate=$("pl").trim();row.capacity_m3=+$("cp");if(!row.plate)return toast("اكتب رقم اللوحة")}
 if(await ok(sb.from("profiles").insert(row)))boot()}
async function newShip(){if($("f")==$("t"))return toast("اختر مدينتين مختلفتين");const w=+$("w"),v=+$("v");if(!w||!v)return toast("اكتب الوزن والحجم");
 if(await ok(sb.from("shipments").insert({customer_id:uid,from_city:$("f"),to_city:$("t"),cargo:$("c")||"بضاعة عامة",weight_t:w,volume_m3:v}),"تم نشر الشحنة")){tab="mine";await load();render()}}
async function book(sid,tid){if(await ok(sb.rpc("book_trip",{p_shipment:sid,p_trip:tid}),"تم الحجز")){await load();render()}}
async function accept(bid){if(await ok(sb.rpc("accept_bid",{p_bid:bid}),"تم قبول العرض")){await load();render()}}
async function bid(sid){ if(isBlocked()){ render(); return toast("حسابك موقوف - لم ترسل العمولة"); } const v=+$("b"+sid);if(!v||v<50)return toast("اكتب سعرًا صحيحًا");if(await ok(sb.from("bids").insert({shipment_id:sid,carrier_id:uid,price:v}),"تم إرسال عرضك")){await load();render()}}
async function postTrip(){ if(isBlocked()){ render(); return toast("حسابك موقوف - لم ترسل العمولة"); } if($("tf")==$("tt"))return toast("اختر مدينتين مختلفتين");const cap=+$("tc");if(!cap)return toast("اكتب السعة");const ret=$("tr")=="1";
 if(await ok(sb.from("trips").insert({carrier_id:uid,from_city:$("tf"),to_city:$("tt"),depart_label:$("td"),capacity_m3:cap,base_ppm:Math.round(base($("tf"),$("tt"))*(ret?.7:1)),is_return:ret}),"تم نشر الرحلة")){tab="my";await load();render()}}
async function verify(id){if(await ok(sb.rpc("verify_carrier",{p_id:id}),"تم توثيق الناقل")){await load();render()}}
function meter(t){let h='<div class="truck" aria-hidden="true">';for(let i=0;i<20;i++)h+=`<i class="${i<Math.round(t.used_m3/t.capacity_m3*20)?"f":""}"></i>`;return h+"</div>"}
function payBox(total){return `<div class="paybox">💰 الدفع كاش عند الاستلام<br>العميل يدفع <b>${money(total)}</b> للسواق كاش<br>عمولة ترجيعة (10%): <b>${money(commOf(total))}</b><br>الصافي للسواق: <b>${money(netOf(total))}</b><br>ابعت العمولة على <b>${PAY_NUMBER}</b> - ${PAY_METHOD}<br><span class="mute">وابعت سكرين شوت على الواتساب</span></div>`}
function customerPayBox(total){return `<div class="note" style="margin-top:8px">💰 الدفع كاش عند الاستلام.<br>هتدفع <b>${money(total)}</b> للسواق لما تستلم شحنتك.</div>`}
function tripCard(t,s){
 const free=t.capacity_m3-t.used_m3,full=base(t.from_city,t.to_city),now=cur(t),pct=Math.round((1-now/full)*100);
 const total=s?Math.round(now*s.volume_m3):0;
 const showComm = (me && me.role=="carrier");
 return`<div class="card"><div class="row"><h3>${L(t.from_city,t.to_city)}</h3>${t.is_return?'<span class="tag ret">ترجيعة</span>':'<span class="tag">رحلة عادية</span>'}</div>
<div class="mute">${esc(cn(t.carrier_id))} · ${esc(t.depart_label||"")} · ${km(t.from_city,t.to_city)} كم</div>${meter(t)}
<div class="row mute"><span>متبقي ${free} م³ من ${t.capacity_m3} م³</span><span>كل ما العربية تمتلي السعر ينزل</span></div>
<div class="row" style="margin-top:8px"><div><span class="price">${money(now)}</span> <span class="mute">/م³</span><div class="save">أرخص ${pct}% من المعتاد (${money(full)})</div></div>
${s?`<button class="btn sign" onclick="book('${s.id}','${t.id}')">احجز ${s.volume_m3} م³ بـ ${money(total)}</button>`:""}</div>
${s && showComm ? `<div class="mute" style="margin-top:8px">الدفع كاش عند الاستلام - عمولة ترجيعة 10% = ${money(commOf(total))} - الصافي ليك ${money(netOf(total))}</div>` : (s ? `<div class="mute" style="margin-top:8px">الدفع كاش عند الاستلام</div>` : "")}</div>`}
async function payFor(sid, amount){
  try{
    toast("بيجهز الدفع...");
    const userRes=await sb.auth.getUser();
    const payRes=await sb.functions.invoke('paymob-create', {body:{amount: amount, shipment_id: sid, customer_name: me?.name||'عميل', customer_email: userRes.data.user?.email||'test@test.com', customer_phone: me?.phone||'01000000000'}});
    if(payRes.error) throw payRes.error;
    const pin = String(Math.floor(1000 + Math.random()*9000));
    localStorage.setItem('pin-'+sid, pin);
    document.getElementById('pin-'+sid).innerHTML = 'كود التسليم بتاعك: <b style="font-size:20px">'+pin+'</b> - اديه للسواق لما يستلم الشحنة. متبعتوش لحد غيره.';
    window.open('https://accept.paymob.com/unifiedcheckout/?publicKey='+encodeURIComponent(payRes.data.public_key)+'&clientSecret='+encodeURIComponent(payRes.data.client_secret), '_blank');
    toast("اتفتح الدفع - جرّب بكارت الاختبار 5123456789012346");
  }catch(e){ toast("مشكلة في الدفع: "+(e.message||e)); }
}
function shipCard(s,k){
 const bids=s.bids||[],mine=s.customer_id==uid;
 const isCarrierView = (me && me.role=="carrier") || (me && me.role=="admin");
 let h=`<div class="card"><div class="row"><h3>${L(s.from_city,s.to_city)}</h3><span class="tag ${s.status=="delivered"?"ok":""}">${SL[s.status]}</span></div><div class="mute">${esc(s.cargo)} · ${s.weight_t} طن · ${s.volume_m3} م³ · ${km(s.from_city,s.to_city)} كم</div>`;
 if(s.status!="open"){
   let payHtml = "";
   if(isCarrierView){ payHtml = payBox(s.price||0); } else { payHtml = customerPayBox(s.price||0); }
   return h+`<div class="row" style="margin-top:8px"><span class="mute">الناقل: ${esc(cn(s.carrier_id))}</span><span class="price">${money(s.price)}</span></div>${payHtml}<div class="row" style="margin-top:8px"><button class="btn sign" style="flex:1" onclick="payFor('${s.id}',${s.price||0})">ادفع ${money(s.price||0)} (تجريبي - Paymob)</button></div><div id="pin-${s.id}" class="mute" style="margin-top:6px"></div></div>`;
 }
 if(k){const my=bids.find(b=>b.carrier_id==uid),sug=Math.round(s.volume_m3*base(s.from_city,s.to_city)*.9),mt=data.trips.filter(t=>t.carrier_id==uid&&t.from_city==s.from_city&&t.to_city==s.to_city&&t.capacity_m3-t.used_m3>=s.volume_m3);
 return h+(my?`<div class="save" style="margin-top:8px">قدّمت عرض بـ ${money(my.price)}</div>`:`<label for="b${s.id}">عرضك (المقترح ${money(sug)})</label><div class="row"><input id="b${s.id}" type="number" inputmode="numeric" value="${sug}" style="flex:1"><button class="btn sign" onclick="bid('${s.id}')">قدّم عرض</button></div>`)+(mt.length?`<button class="btn full" onclick="book('${s.id}','${mt[0].id}')">ضمّها لرحلتك بـ ${money(cur(mt[0])*s.volume_m3)}</button>`:"")+"</div>"}
 if(!mine)return h+"</div>";
 const m=data.trips.filter(t=>t.from_city==s.from_city&&t.to_city==s.to_city&&t.capacity_m3-t.used_m3>=s.volume_m3);
 return h+"</div>"+(m.length?`<div class="mute" style="margin:-4px 0 8px">ترجيعات ورحلات مناسبة لشحنتك:</div>`+m.map(t=>tripCard(t,s)).join(""):"")+(bids.length?`<div class="card"><b>عروض الناقلين</b>`+bids.slice().sort((a,b)=>a.price-b.price).map(b=>`<div class="bid row"><div>${esc(cn(b.carrier_id))}<div class="mute">تقييم ${data.names[b.carrier_id]?.rating??"-"}</div></div><div><span class="price">${money(b.price)}</span> <button class="btn sign" onclick="accept('${b.id}')">اقبل</button></div></div>`).join("")+"</div>":(m.length?"":`<div class="card empty">لا توجد ترجيعات على هذا الخط الآن. ستصلك عروض الناقلين هنا.</div>`))}
function authView(){return`<div class="card"><h3 style="color:#1b2430">${mode=="in"?"تسجيل الدخول":"إنشاء حساب جديد"}</h3><label for="em">الإيميل</label><input id="em" type="email" autocomplete="email"><label for="pw">الباسورد</label><input id="pw" type="password" autocomplete="${mode=="in"?"current-password":"new-password"}">
<button class="btn sign full" onclick="auth('${mode=="in"?"in":"up"}')">${mode=="in"?"دخول":"إنشاء الحساب"}</button><p class="mute" style="text-align:center"><a href="#" onclick="mode='${mode=="in"?"up":"in"}';render();return false">${mode=="in"?"معنديش حساب، أسجّل":"عندي حساب، أدخل"}</a></p></div>`}
function onboard(){return`<div class="card"><h3 style="color:#1b2430">أهلًا بك في ترجيعة</h3><label for="n">الاسم</label><input id="n"><label for="ph">رقم الهاتف</label><input id="ph" inputmode="tel">
<div class="row" style="margin-top:14px"><button class="btn sign" style="flex:1" onclick="mkProfile('customer')">سجّل كعميل</button><button class="btn" style="flex:1" onclick="document.getElementById('kx').hidden=false">سجّل كناقل</button></div>
<div id="kx" hidden><div class="g2"><div><label for="pl">رقم اللوحة</label><input id="pl"></div><div><label for="cp">السعة (م³)</label><input id="cp" type="number" value="40"></div></div><button class="btn sign full" onclick="mkProfile('carrier')">أرسل للتوثيق</button><p class="mute">هنتصل بيك على رقمك ونراجع بياناتك قبل ما تقدر تنشر رحلات.</p></div></div>`}
function render(){const A=document.getElementById("app"),T=document.getElementById("tabs"),R=document.getElementById("roles");T.innerHTML="";R.innerHTML="";
if(!uid){A.innerHTML=authView();return}
R.innerHTML=`<button class="on" onclick="logout()">${me?esc(me.name):"حسابي"} · خروج</button>`;
if(!me){A.innerHTML=onboard();return}
if(me.role=="carrier"&&!me.verified){A.innerHTML=`<div class="card empty">طلبك قيد المراجعة. هنفعّل حسابك بعد التواصل معاك.</div>`;return}
if(me.role=="carrier" && isBlocked()){
  tab="my";
  T.innerHTML=`<button class="on">رحلاتي وشحناتي</button>`;
  A.innerHTML=blockedView()+`<div class="card"><h3>شحنات عليك</h3><div class="mute">مش هتقدر تنشر رحلة جديدة لحد ما تبعت العمولة</div></div>`;
  return;
}
const TT=me.role=="customer"?[["new","اطلب شحنة"],["mine","شحناتي"],["trips","الترجيعات"]]:me.role=="carrier"?[["post","انشر رحلة"],["req","طلبات العملاء"],["my","رحلاتي وشحناتي"]]:[["rev","توثيق الناقلين"],["trips","الرحلات"]];
if(!TT.some(x=>x[0]==tab))tab=TT[0][0];
T.innerHTML=TT.map(([k,t])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';render()">${t}</button>`).join("")+`<button onclick="refresh()">تحديث</button>`;
let h="";
if(tab=="new")h=`<div class="card"><h3 style="color:#1b2430">إيه اللي عايز تشحنه؟</h3><div class="g2"><div><label for="f">من</label><select id="f">${opts(CITIES,"القاهرة")}</select></div><div><label for="t">إلى</label><select id="t">${opts(CITIES,"الغردقة")}</select></div></div><label for="c">نوع البضاعة</label><input id="c" placeholder="مثال: كراتين أجهزة كهربائية"><div class="g2"><div><label for="w">الوزن (طن)</label><input id="w" type="number" inputmode="decimal" value="2"></div><div><label for="v">الحجم (م³)</label><input id="v" type="number" inputmode="decimal" value="8"></div></div><button class="btn sign full" onclick="newShip()">انشر الشحنة واعرف الأسعار</button></div>`;
if(tab=="mine"){const a=data.ships.filter(s=>s.customer_id==uid);h=a.length?a.map(s=>shipCard(s,0)).join(""):`<div class="empty">لسه ما نشرتش شحنات. ابدأ من «اطلب شحنة».</div>`}
if(tab=="trips")h=data.trips.length?data.trips.map(t=>tripCard(t,null)).join(""):`<div class="empty">مفيش رحلات منشورة حاليًا.</div>`;
if(tab=="post")h=`<div class="card"><h3>نشر رحلة</h3><div class="g2"><div><label for="tf">من</label><select id="tf">${opts(CITIES,"الغردقة")}</select></div><div><label for="tt">إلى</label><select id="tt">${opts(CITIES,"القاهرة")}</select></div></div><div class="g2"><div><label for="td">موعد التحرك</label><select id="td">${opts(DATES)}</select></div><div><label for="tc">سعة العربية (م³)</label><input id="tc" type="number" value="${me.capacity_m3||40}"></div></div><label for="tr">نوع الرحلة</label><select id="tr"><option value="1">ترجيعة (راجع فاضي، سعر أقل)</option><option value="0">رحلة عادية</option></select><button class="btn sign full" onclick="postTrip()">انشر الرحلة</button></div>`;
if(tab=="req"){const a=data.ships.filter(s=>s.status=="open");h=a.length?a.map(s=>shipCard(s,1)).join(""):`<div class="empty">مفيش طلبات مفتوحة دلوقتي.</div>`}
if(tab=="my"){const mt=data.trips.filter(t=>t.carrier_id==uid),ms=data.ships.filter(s=>s.carrier_id==uid);h=(mt.map(t=>tripCard(t,null)).join(""))+(ms.length?`<h3>شحنات عليك</h3>`+ms.map(s=>shipCard(s,1)).join(""):"")||`<div class="empty">انشر أول رحلة أو قدّم عرض على طلب عميل.</div>`}
if(tab=="rev")h=data.pend.length?data.pend.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="mute">لوحة ${esc(p.plate||"")} · سعة ${p.capacity_m3||""} م³ · ${esc(p.phone)}</div><button class="btn sign full" onclick="verify('${p.id}')">وثّق الناقل</button></div>`).join(""):`<div class="empty">لا توجد طلبات توثيق.</div>`;
A.innerHTML=h}
async function refresh(){if(me){await load();render();toast("تم التحديث")}}
render();
boot();
setTimeout(()=>{let a=document.getElementById("app");if(a && a.innerHTML.includes("جاري التحميل")){render();}},2000);
</script>
</body>
</html>
